<style>
/* Layout: a phone-first app shell. Header, one scrolling screen, bottom tab bar; list detail slides in over it; typing happens in a bottom sheet. Single deliberate light look (Sourcely brand kit). */
:root{
  --paper:#F3F1EC; --card:#FFFFFF; --ink:#0B0B0F; --muted:#5E5C57; --rule:#D6D2C8;
  --lemon:#FFE62E; --bubblegum:#FF7AA8; --tomato:#FF5A3C; --leaf:#6EE06B; --cobalt:#2B5CFF;
  --display:'Bricolage Grotesque','Arial Black',Arial,sans-serif;
  --body:'DM Sans','Helvetica Neue',Arial,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;letter-spacing:inherit}
:focus-visible{outline:3px solid var(--cobalt);outline-offset:3px}
.shell{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;position:relative;overflow:hidden;background:var(--paper)}
.top{display:flex;justify-content:space-between;align-items:center;padding:12px max(20px,env(safe-area-inset-right,0px)) 6px max(20px,env(safe-area-inset-left,0px))}
.cap{font:500 11px/1.4 var(--body);letter-spacing:.08em;text-transform:uppercase}
.cap .dim{color:var(--muted)}
.screens{flex:1;position:relative;overflow:hidden}
.screen{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px max(20px,env(safe-area-inset-right,0px)) 28px max(20px,env(safe-area-inset-left,0px));box-sizing:border-box}
.title{font:800 34px/1.05 var(--display);letter-spacing:-.035em;margin:6px 0 16px}

/* spin */
.spin{display:flex;flex-direction:column;justify-content:center;gap:26px;min-height:100%}
.line{margin:0;font-family:var(--display);font-weight:800;letter-spacing:-.035em;font-size:clamp(40px,11.5vw,54px);line-height:1.15;display:flex;flex-direction:column;align-items:flex-start;gap:12px}
.bob{display:inline-block;transform-origin:20% 100%;animation:jelly 3.4s ease-in-out infinite}
.bob.b2{animation-delay:-1.7s}
@keyframes jelly{0%,100%{transform:translateY(0) scale(1,1)}30%{transform:translateY(-.06em) scale(.98,1.04)}48%{transform:translateY(0) scale(1.04,.96)}62%{transform:scale(.99,1.01)}}
.gum{position:relative;display:inline-block;border-radius:.42em;padding:0 .28em;transform-origin:50% 100%;cursor:pointer;transition:background-color .8s ease;
  -webkit-backdrop-filter:blur(5px) saturate(1.7);backdrop-filter:blur(5px) saturate(1.7);
  background-image:radial-gradient(ellipse 70% 60% at 62% 108%,rgba(255,255,255,.6),rgba(255,255,255,0) 70%),radial-gradient(ellipse 120% 95% at 50% 50%,rgba(255,255,255,0) 52%,rgba(11,11,15,.12) 100%);
  box-shadow:inset 0 -.15em .26em rgba(11,11,15,.16),inset 0 .1em .22em rgba(255,255,255,.85),inset .07em 0 .16em rgba(255,255,255,.4),inset 0 0 0 .025em rgba(255,255,255,.6),0 .22em .36em rgba(11,11,15,.12)}
.gum::before{content:"";position:absolute;left:.14em;top:.07em;width:48%;height:.24em;border-radius:999px;background:linear-gradient(rgba(255,255,255,.98),rgba(255,255,255,.08));pointer-events:none;z-index:2}
.gum::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:2;animation:tw 2.6s ease-in-out infinite;
  background-image:radial-gradient(circle at 88% 22%,#fff 0 .035em,rgba(255,255,255,0) .075em),radial-gradient(circle at 78% 32%,rgba(255,255,255,.9) 0 .018em,rgba(255,255,255,0) .04em),radial-gradient(circle at 16% 72%,rgba(255,255,255,.95) 0 .022em,rgba(255,255,255,0) .05em),radial-gradient(circle at 40% 86%,rgba(255,255,255,.85) 0 .016em,rgba(255,255,255,0) .035em),radial-gradient(circle at 64% 64%,rgba(255,255,255,.8) 0 .014em,rgba(255,255,255,0) .03em),radial-gradient(circle at 93% 80%,rgba(255,255,255,.85) 0 .018em,rgba(255,255,255,0) .04em)}
@keyframes tw{0%,100%{opacity:.35}50%{opacity:1}}
.gum.land{animation:land .75s cubic-bezier(.3,1.5,.5,1)}
@keyframes land{0%{transform:scale(1.14,.84)}30%{transform:scale(.92,1.1)}55%{transform:scale(1.05,.96)}78%{transform:scale(.99,1.02)}100%{transform:scale(1,1)}}
.win{display:block;height:1.15em;overflow:hidden;transition:width .55s cubic-bezier(.3,1.4,.5,1)}
.strip{display:block}
.cell{display:block;height:1.15em;line-height:1.15em;white-space:nowrap}
.measure{position:absolute;visibility:hidden;white-space:pre;pointer-events:none;left:-9999px;top:0}
.hint{margin:-10px 0 0;font:500 13px var(--body);color:var(--muted);display:flex;align-items:center;gap:6px}
.shelf{display:flex;gap:12px;flex-wrap:wrap}
.gummy{width:44px;height:44px;filter:drop-shadow(0 7px 8px rgba(11,11,15,.16));transform-origin:50% 100%;animation:jelly 3s ease-in-out infinite}
.tw{animation:tw 2.2s ease-in-out infinite}
.actions{display:flex;flex-direction:column;gap:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:12px;min-height:56px;border-radius:999px;font:700 17px var(--body);cursor:pointer;border:2px solid var(--ink);background:transparent;color:var(--ink);width:100%;box-sizing:border-box;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.btn:active{transform:scale(.96)}
.btn.ink{background:var(--ink);color:#fff;justify-content:space-between;padding:0 8px 0 24px}
.btn.lemon{background:var(--lemon);border-color:var(--lemon)}

.dot{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;background:var(--lemon)}

/* rows */
.search{display:flex;align-items:center;gap:10px;min-height:48px;border-radius:999px;background:var(--card);padding:0 16px;margin-bottom:8px;box-shadow:inset 0 0 0 1.5px var(--rule)}
.search input{all:unset;flex:1;font:500 16px var(--body)}
.group{font:500 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:22px 0 4px}
.row{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-top:1px solid var(--rule)}
.row:active{opacity:.6}
.row .t{font:800 19px/1.3 var(--display);letter-spacing:-.02em}
.chip{display:inline-block;border-radius:.4em;padding:0 .22em;box-shadow:inset 0 -.1em .16em rgba(11,11,15,.14),inset 0 .08em .14em rgba(255,255,255,.8)}
.arr{flex:none;color:var(--muted);font-weight:700}
.empty{border:2px dashed var(--rule);border-radius:24px;padding:28px 20px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}

/* detail */
.detail{position:absolute;inset:0;background:var(--paper);z-index:20;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .38s cubic-bezier(.2,.9,.25,1)}
.detail.open{transform:none}
.dbar{display:flex;justify-content:space-between;align-items:center;padding:12px max(20px,env(safe-area-inset-right,0px)) 8px max(20px,env(safe-area-inset-left,0px))}
.icon{all:unset;cursor:pointer;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 2px var(--ink);transition:transform .25s cubic-bezier(.3,1.6,.5,1),background-color .2s}
.icon:active{transform:scale(.9)}
.icon.on{background:var(--lemon)}
.dscroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px max(20px,env(safe-area-inset-right,0px)) calc(32px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.dtitle{margin:0;font:800 40px/1.15 var(--display);letter-spacing:-.035em;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.dtitle .gum{cursor:default}
.who{margin:12px 0 20px;font-size:15px;line-height:1.5;color:var(--muted)}
.cards{display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:8px;box-shadow:0 1px 0 rgba(11,11,15,.05),0 8px 20px rgba(11,11,15,.05)}
.card .h{display:flex;align-items:baseline;gap:12px}
.card .n{font:800 30px/1 var(--display);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.card h2{margin:0;font:800 21px/1.15 var(--display);letter-spacing:-.02em}
.card p{margin:0;font-size:15px;line-height:1.5}
.card .kv{border-top:1px solid #ECE9E1;padding-top:8px;display:flex;flex-direction:column;gap:2px}
.lab{font:500 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card a{font:700 14px var(--body);color:var(--ink)}
.note{font-size:13px;line-height:1.5;color:var(--muted);margin:18px 0 0}

/* tab bar */
.tabs{display:flex;border-top:1.5px solid var(--ink);background:var(--paper);padding:4px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));position:relative;z-index:10}
.tab{all:unset;cursor:pointer;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:54px;font:700 10px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tab[aria-current="page"]{color:var(--ink)}
.tab .badge{display:inline-block;min-width:16px;padding:0 4px;border-radius:999px;background:var(--bubblegum);color:var(--ink);font-size:10px;line-height:16px}

/* sheet */
.scrim{position:absolute;inset:0;background:rgba(11,11,15,.38);z-index:30;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:31;background:var(--paper);border-radius:28px 28px 0 0;padding:10px max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));max-height:88%;overflow-y:auto;transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.9,.25,1);display:flex;flex-direction:column;gap:14px;box-sizing:border-box}
.sheet.open{transform:none}
.grab{width:44px;height:5px;border-radius:999px;background:var(--rule);align-self:center}
.field{display:flex;flex-direction:column;gap:6px}
.field input{min-height:52px;border:2px solid var(--ink);border-radius:16px;padding:0 16px;font:700 18px var(--body);background:var(--card);color:var(--ink);width:100%;box-sizing:border-box}
.wah{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.wah h2{margin:0;font:800 36px/1 var(--display);letter-spacing:-.035em}
.tag{font:700 11px var(--body);letter-spacing:.08em;text-transform:uppercase;background:var(--bubblegum);border-radius:999px;padding:5px 10px}
.foot{text-align:center;font:500 10px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:28px}

@media (prefers-reduced-motion:reduce){.bob,.gummy,.gum::after,.tw,.gum.land{animation:none}.win,.detail,.sheet{transition:none}}
</style>
</head>
<body>
<div class="shell" id="shell">
  <header class="top">
    <div class="cap"><strong>The Best Of.</strong><br><span class="dim">By LīMEN</span></div>

  <div class="screens">

  var GROUPS = [["Startup ideas",0,7],["Learning",8,12],["Watch & read",13,16],["Self-development",17,25],["Starter tools",26,29]];

  var $ = function(id){ return document.getElementById(id); };
  var rand = function(n){ return Math.floor(Math.random()*n); };
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var COLORS = ["rgba(255,230,46,.5)","rgba(255,122,168,.5)","rgba(255,90,60,.48)","rgba(110,224,107,.5)"];
  var SOLID = ["rgba(255,230,46,.8)","rgba(255,122,168,.75)","rgba(255,90,60,.65)","rgba(110,224,107,.75)"];
  function uniq(a){ var s = {}; return a.filter(function(x){ var k = x.toLowerCase(); if (s[k]) return false; s[k] = 1; return true; }); }
  var ADJS = uniq(LISTS.map(function(l){ return l.adj; })), KINDS = uniq(LISTS.map(function(l){ return l.kind; }));
  function sing(t){ if (t.length > 3 && /ies$/.test(t)) return t.slice(0,-3) + "y"; if (t.length > 3 && /s$/.test(t) && !/ss$/.test(t)) return t.slice(0,-1); return t; }
  function tokens(w){ return String(w).toLowerCase().replace(/[^a-z0-9$]+/g," ").trim().split(" ").filter(Boolean).map(sing); }
  function norm(w){ return tokens(w).join(" "); }
  LISTS.forEach(function(l, i){ l.id = i; l.tok = {}; tokens(l.adj + " " + l.kind + " " + l.kw).forEach(function(t){ l.tok[t] = 1; }); });
  function find(a, k){ a = norm(a); k = norm(k); for (var i = 0; i < LISTS.length; i++) if (norm(LISTS[i].adj) === a && norm(LISTS[i].kind) === k) return LISTS[i]; return null; }
  function tidy(w){ w = String(w).replace(/\s+/g," ").trim().slice(0,40); return w.charAt(0).toUpperCase() + w.slice(1); }
  function el(tag, cls, text){ var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function host(u){ try { return new URL(u).hostname.replace(/^www\./,""); } catch(e){ return ""; } }

  $("count").textContent = LISTS.length + " lists";
  $("adj-options").innerHTML = ADJS.map(function(w){ return '<option value="'+w+'"></option>'; }).join("");
  $("kind-options").innerHTML = KINDS.map(function(w){ return '<option value="'+w+'"></option>'; }).join("");

  // ----- saved (this device only) -----
  var saved = [];
  try { saved = JSON.parse(localStorage.getItem("tbo-saved") || "[]").filter(function(i){ return LISTS[i]; }); } catch(e) { saved = []; }
  function persist(){ try { localStorage.setItem("tbo-saved", JSON.stringify(saved)); } catch(e) {} }

  // ----- reels -----
  var measure = $("measure");
  function widthOf(w){ measure.textContent = w || " "; return measure.getBoundingClientRect().width; }
  var reels = [
    { gum:$("gumA"), win:$("winA"), strip:$("stripA"), pool:ADJS, cur:"", dur:1400, extra:14 },
    { gum:$("gumB"), win:$("winB"), strip:$("stripB"), pool:KINDS, cur:"", dur:1950, extra:20 }
  ];
  var current = null, colorIdx = [0,1], spinning = false;
  function cells(words){ var f = document.createDocumentFragment(); words.forEach(function(w){ f.appendChild(el("span","cell",w)); }); return f; }
  function setWidth(r, w){ r.win.style.width = Math.ceil(widthOf(w)) + "px"; }
  function place(r, w){ r.cur = w; r.strip.textContent = ""; r.strip.appendChild(cells([w])); r.strip.style.transition = "none"; r.strip.style.transform = "translateY(0)"; setWidth(r, w); }
  function land(r){ r.gum.classList.remove("land"); void r.gum.offsetWidth; r.gum.classList.add("land"); }
  function newColors(){ var a = rand(4), b = (a + 1 + rand(3)) % 4; colorIdx = [a,b]; reels[0].gum.style.backgroundColor = COLORS[a]; reels[1].gum.style.backgroundColor = COLORS[b]; }
  function roll(r, target, cb){
    if (reduce) { place(r, target); cb(); return; }
    var words = [r.cur]; for (var i = 0; i < r.extra; i++) words.push(r.pool[rand(r.pool.length)]); words.push(target);
    r.strip.textContent = ""; r.strip.appendChild(cells(words));
    r.strip.style.transition = "none"; r.strip.style.transform = "translateY(0)"; void r.strip.offsetHeight;
    r.strip.style.transition = "transform " + r.dur + "ms cubic-bezier(.16,.84,.3,1.08)";
    r.strip.style.transform = "translateY(-" + ((words.length - 1) * 1.15).toFixed(3) + "em)";
    setTimeout(function(){ setWidth(r, target); }, r.dur * .55);
    setTimeout(function(){ place(r, target); land(r); cb(); }, r.dur + 40);
  }
  function goTo(list){
    if (spinning) return;
    spinning = true; $("spin").disabled = true;
    newColors();
    var left = 2;
    roll(reels[0], list.adj, done); roll(reels[1], list.kind, done);
    function done(){ if (--left === 0) { spinning = false; $("spin").disabled = false; current = list; } }
  }
  function spin(){ var n; do { n = LISTS[rand(LISTS.length)]; } while (n === current); goTo(n); }

      var items = LISTS.slice(g[1], g[2] + 1).filter(function(l){ return !q || norm(l.adj + " " + l.kind + " " + l.kw).indexOf(q) >= 0; });
      if (!items.length) return;
      any = true;
      box.appendChild(el("div","group",g[0]));
      var wrap = el("div"); wrap.style.borderBottom = "1px solid var(--rule)";
      items.forEach(function(l){ wrap.appendChild(rowFor(l, l.id)); });
      box.appendChild(wrap);

    if (!any) box.appendChild(el("p","hint","No lists match that yet. Try another word."));
  }
  $("q").addEventListener("input", renderExplore);
  function renderSaved(){
    var box = $("saved-list"); box.textContent = "";

    var badge = $("badge"); badge.hidden = !saved.length; badge.textContent = saved.length;
  }
  $("go-spin").addEventListener("click", function(){ showTab("spin"); });

    $("dwho").textContent = "For " + l.who.charAt(0).toLowerCase() + l.who.slice(1) + ".";
    var cards = $("dcards"); cards.textContent = "";

      c.appendChild(hd); c.appendChild(el("p",null,p.what));
      var kv = el("div","kv"); kv.appendChild(el("span","lab",l.lab)); var v = el("span",null,p.best); v.style.fontSize = "14px"; v.style.lineHeight = "1.45"; kv.appendChild(v); c.appendChild(kv);
      if (p.url) { var a = el("a",null,"Visit " + host(p.url) + " →"); a.href = p.url; a.target = "_blank"; a.rel = "noopener"; c.appendChild(a); }
      cards.appendChild(c);

  }
  function closeDetail(){ $("detail").classList.remove("open"); $("detail").setAttribute("aria-hidden","true"); }
  function syncSave(){ var on = open && saved.indexOf(open.id) >= 0; var b = $("save"); b.classList.toggle("on", !!on); b.setAttribute("aria-pressed", on ? "true" : "false"); b.setAttribute("aria-label", on ? "Remove from saved" : "Save this list"); $("save-path").setAttribute("fill", on ? "#0B0B0F" : "none"); }
  $("save").addEventListener("click", function(){ if (!open) return; var k = saved.indexOf(open.id); if (k >= 0) saved.splice(k,1); else saved.push(open.id); persist(); syncSave(); renderSaved(); });
  $("back").addEventListener("click", closeDetail);
  $("dspin").addEventListener("click", function(){ closeDetail(); showTab("spin"); setTimeout(spin, 300); });
  $("read").addEventListener("click", function(){ if (current) openDetail(current); });
  $("spin").addEventListener("click", spin);

  // ----- sheet -----
  var NICHE = [["Wah wah.","Nobody has asked for “The best of {c}” yet. Respect. These are close:"],["Ooh, niche.","“The best of {c}” isn’t a list yet. You’re early. Try these:"],["Too niche (for now).","We haven’t written “The best of {c}” yet. Closest picks:"]];
  var nt = 0;
  function openSheet(focusB){
    $("ia").value = reels[0].cur; $("ib").value = reels[1].cur;
    $("sheet-form").hidden = false; $("sheet-miss").hidden = true;
    $("scrim").classList.add("open"); $("sheet").classList.add("open"); $("sheet").setAttribute("aria-hidden","false");
    setTimeout(function(){ var i = focusB ? $("ib") : $("ia"); i.focus(); i.select(); }, 380);
  }
  function closeSheet(){ $("scrim").classList.remove("open"); $("sheet").classList.remove("open"); $("sheet").setAttribute("aria-hidden","true"); }
  reels[0].gum.addEventListener("click", function(){ if (!spinning) openSheet(false); });
  reels[1].gum.addEventListener("click", function(){ if (!spinning) openSheet(true); });
  $("scrim").addEventListener("click", closeSheet);
  $("cancel").addEventListener("click", closeSheet);
  $("retype").addEventListener("click", function(){ $("sheet-form").hidden = false; $("sheet-miss").hidden = true; $("ia").focus(); });
  function recommend(a, b){
    var kt = tokens(b), at = tokens(a), nk = norm(b);
    var sc = LISTS.map(function(l){
      var s = 0;
      if (norm(l.kind) === nk) s += 6;
      kt.forEach(function(t){ if (l.tok[t]) s += 3; else if (t.length > 3) { for (var k in l.tok) { if (k.length > 3 && (k.indexOf(t) === 0 || t.indexOf(k) === 0)) { s += 1.5; break; } } } });
      at.forEach(function(t){ if (l.tok[t]) s += 1; });
      return { l:l, s:s + Math.random()*.01 };
    }).sort(function(x,y){ return y.s - x.s; });
    var out = sc.filter(function(x){ return x.s >= 1; }).slice(0,3).map(function(x){ return x.l; });
    while (out.length < 3) { var r = LISTS[rand(LISTS.length)]; if (out.indexOf(r) < 0) out.push(r); }
    return out;
  }
  $("form").addEventListener("submit", function(e){
    e.preventDefault();
    var a = tidy($("ia").value), b = tidy($("ib").value);
    if (!a || !b) return;
    var hit = find(a, b);
    if (hit) { closeSheet(); if (hit !== current) setTimeout(function(){ goTo(hit); }, 250); return; }
    document.activeElement && document.activeElement.blur && document.activeElement.blur();
    var line = NICHE[nt++ % NICHE.length];
    $("wah-head").textContent = line[0];
    $("wah-text").textContent = line[1].replace("{c}", a + " " + b);
    var box = $("recs"); box.textContent = "";
    var wrap = el("div"); wrap.style.borderBottom = "1px solid var(--rule)";
    recommend(a, b).forEach(function(l, k){
      wrap.appendChild(rowFor(l, k, function(x){ closeSheet(); setTimeout(function(){ goTo(x); }, 250); }));
    });
    box.appendChild(wrap);
    $("sheet-form").hidden = true; $("sheet-miss").hidden = false;
  });

  // ----- gummy shelf -----
  var PAL = { lemon:["#FFF8C2","#FFE62E","#B89400","#8A6E00"], pink:["#FFE0EC","#FF7AA8","#B83466","#8F1F49"], tomato:["#FFD0C4","#FF5A3C","#A8260F","#7A1A08"], leaf:["#DFFFDA","#6EE06B","#24852A","#155C1A"], cobalt:["#D6E0FF","#2B5CFF","#12298F","#0A1A66"] };
  var BEAR = '<circle cx="31" cy="15" r="9"/><circle cx="69" cy="15" r="9"/><circle cx="50" cy="28" r="19"/><ellipse cx="50" cy="64" rx="22" ry="24"/><ellipse cx="27" cy="55" rx="8" ry="12" transform="rotate(30 27 55)"/><ellipse cx="73" cy="55" rx="8" ry="12" transform="rotate(-30 73 55)"/><circle cx="36" cy="87" r="10"/><circle cx="64" cy="87" r="10"/>';
  var SHAPES = {
    bear:{ body:function(){ return BEAR; }, hi:'<ellipse cx="42" cy="19" rx="8" ry="3.2" fill="#fff" opacity=".95" transform="rotate(-25 42 19)"/><ellipse cx="38" cy="56" rx="3" ry="9" fill="#fff" opacity=".6"/>', sp:[[40,48,1.3],[58,44,1],[56,62,1.4]], star:[60,66] },
    star:{ body:function(id){ return '<polygon points="50,12 59.99,38.25 88.04,39.64 66.17,57.25 73.51,84.36 50,69 26.49,84.36 33.83,57.25 11.96,39.64 40.01,38.25" stroke="url(#g'+id+')" stroke-width="9" stroke-linejoin="round"/>'; }, hi:'<ellipse cx="44" cy="31" rx="6" ry="2.6" fill="#fff" opacity=".95" transform="rotate(-55 44 31)"/>', sp:[[40,50,1.2],[58,44,1],[56,60,1.4]], star:[52,48] },
    sphere:{ body:function(){ return '<circle cx="50" cy="50" r="40"/>'; }, hi:'<ellipse cx="34" cy="28" rx="10" ry="4" fill="#fff" opacity=".95" transform="rotate(-35 34 28)"/>', sp:[[40,50,1.3],[58,44,1],[56,60,1.4]], star:[64,40] },
    tri:{ body:function(id){ return '<polygon points="18,22 82,22 50,80" stroke="url(#g'+id+')" stroke-width="14" stroke-linejoin="round"/>'; }, hi:'<ellipse cx="34" cy="22" rx="10" ry="2.6" fill="#fff" opacity=".95"/>', sp:[[40,36,1.2],[58,34,1],[52,50,1.4]], star:[62,38] },
    heart:{ body:function(){ return '<path d="M50 86 C20 66 8 48 14 32 C20 16 42 14 50 30 C58 14 80 16 86 32 C92 48 80 66 50 86 Z"/>'; }, hi:'<ellipse cx="28" cy="29" rx="8" ry="3.2" fill="#fff" opacity=".95" transform="rotate(-40 28 29)"/>', sp:[[40,50,1.3],[58,44,1],[56,60,1.4]], star:[68,36] }
  };
  function sparkle(x,y){ return '<path d="M'+x+' '+(y-5)+' L'+(x+1)+' '+(y-1)+' L'+(x+5)+' '+y+' L'+(x+1)+' '+(y+1)+' L'+x+' '+(y+5)+' L'+(x-1)+' '+(y+1)+' L'+(x-5)+' '+y+' L'+(x-1)+' '+(y-1)+' Z"/>'; }
  function gummy(kind, pal, id, delay){
    var s = SHAPES[kind], c = PAL[pal];
    var dots = s.sp.map(function(p){ return '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="'+p[2]+'"/>'; }).join("");
    return '<svg class="gummy" viewBox="0 0 100 100" style="animation-delay:'+delay+'s"><defs><radialGradient id="g'+id+'" gradientUnits="userSpaceOnUse" cx="56" cy="60" r="56"><stop offset="0" stop-color="'+c[0]+'"/><stop offset=".5" stop-color="'+c[1]+'"/><stop offset="1" stop-color="'+c[2]+'"/></radialGradient><filter id="f'+id+'" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB"><feGaussianBlur in="SourceAlpha" stdDeviation="3.5" result="b"/><feSpecularLighting in="b" surfaceScale="5" specularConstant="1.3" specularExponent="22" lighting-color="#ffffff" result="s"><fePointLight x="28" y="6" z="70"/></feSpecularLighting><feComposite in="s" in2="SourceAlpha" operator="in" result="si"/><feOffset in="SourceAlpha" dx="-3" dy="-4" result="o"/><feGaussianBlur in="o" stdDeviation="4" result="ob"/><feComposite in="SourceAlpha" in2="ob" operator="out" result="rim"/><feFlood flood-color="'+c[3]+'" flood-opacity=".55"/><feComposite in2="rim" operator="in" result="rc"/><feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="rc"/><feMergeNode in="si"/></feMerge></filter></defs><g opacity=".7"><g filter="url(#f'+id+')" fill="url(#g'+id+')">'+s.body(id)+'</g></g>'+s.hi+'<g class="tw" fill="#fff" style="animation-delay:'+(delay+.4)+'s">'+dots+sparkle(s.star[0],s.star[1])+'</g></svg>';
  }
  var shelf = [["bear","lemon"],["star","pink"],["sphere","tomato"],["tri","leaf"],["heart","cobalt"],["bear","tomato"]];
  $("shelf").innerHTML = shelf.map(function(p,i){ return gummy(p[0], p[1], "a"+i, -i*.37); }).join("");

  // ----- start -----
  var first = LISTS[rand(LISTS.length)];
  reels[0].cur = first.adj; reels[1].cur = first.kind;
  place(reels[0], first.adj); place(reels[1], first.kind); newColors(); current = first;
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ reels.forEach(function(r){ setWidth(r, r.cur); }); });
  window.addEventListener("resize", function(){ reels.forEach(function(r){ setWidth(r, r.cur); }); });
  renderExplore(); renderSaved();
})();
</script>
</body>
</html>
