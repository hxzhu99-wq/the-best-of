}
html,body{height:100%}

@keyframes tw{0%,100%{opacity:.35}50%{opacity:1}}

      ["Morning Brew","https://www.morningbrew.com","Quick, fun daily business news.","Daily news","free easy daily fun popular"],
      ["The Hustle","https://thehustle.co","Business and tech stories.","Business ideas","free daily earn"],
      ["Lenny's Newsletter","https://www.lennysnewsletter.com","Advice on products and growth.","Product people","free pro"],
      ["TLDR","https://tldr.tech","Daily tech news in five minutes.","Tech news","free fast daily"],
      ["Dense Discovery","https://www.densediscovery.com","Design, culture and tools.","Creatives","free creative underrated weekend"],
      ["Not Boring","https://www.notboring.co","Long essays on business strategy.","Deep dives","free pro"],
      ["Indie Hackers newsletter","https://www.indiehackers.com","Stories from bootstrapped founders.","Solo founders","free solo earn"]]),
    T("Payment Apps","sellers taking money online or in person","Best for","payment payments pay checkout card reader pos money",[
      ["Stripe","https://stripe.com","Online payments and payment links.","Online checkout","online pro popular"],
      ["Square","https://squareup.com","Card readers and a free point-of-sale app.","Markets and pop-ups","easy mobile popular weekend"],
      ["SumUp","https://www.sumup.com","Low-cost card readers, popular in Europe.","EU sellers","cheap easy mobile"],
      ["PayPal","https://www.paypal.com","Checkout many buyers trust.","Quick payments","easy online popular fast"],
      ["Ko-fi","https://ko-fi.com","Tips and small sales with no setup.","Creators","free easy online creative"],
      ["Gumroad","https://gumroad.com","Sell digital products instantly.","Digital goods","free easy online fast"]]),
    T("Invoice Tools","freelancers and side hustlers getting paid","Best for","invoice invoices invoicing billing accounting bookkeeping paid freelance",[
      ["Wave","https://www.waveapps.com","Free invoicing and basic accounting.","US and Canada freelancers","free easy online"],
      ["Zoho Invoice","https://www.zoho.com/invoice/","Free invoices with reminders.","Many currencies","free online pro"],
      ["Invoice Ninja","https://invoiceninja.com","Open-source invoicing, free hosted plan.","Open-source fans","free online underrated"],
      ["PayPal Invoicing","https://www.paypal.com/invoice","Invoices clients can pay by card.","PayPal users","easy online fast"],
      ["Stripe Invoicing","https://stripe.com/invoicing","Invoices with online payment.","Online clients","online pro"],
      ["Google Docs template","https://docs.google.com","A simple invoice template.","Your first invoice","free easy fast"]]),
    T("Marketplaces","makers who want buyers before they have a website","Best for","marketplace marketplaces sell handmade vintage art products buyers resale",[
      ["Etsy","https://www.etsy.com","The biggest handmade and vintage marketplace.","Handmade goods","easy online creative popular"],
      ["Depop","https://www.depop.com","Fashion marketplace popular with Gen Z.","Vintage and streetwear","easy mobile eco fun"],
      ["Vinted","https://www.vinted.com","Secondhand fashion, huge in Europe.","Everyday clothing","free easy mobile eco"],
      ["Faire","https://www.faire.com","Wholesale to independent shops.","Getting into boutiques","online pro earn"],
      ["eBay","https://www.ebay.com","Huge audience for almost anything.","Rare finds","easy online popular"],
      ["Facebook Marketplace","https://www.facebook.com/marketplace/","Sell locally with no shipping.","Furniture and big items","free easy mobile eco social"],
      ["Gumroad","https://gumroad.com","Marketplace for digital products.","Digital goods","free easy online"]])
  );

  // Build every combo that has at least 3 matching picks.
  var LISTS = [];
  (function(){
    var seen = {};
    TOPICS.forEach(function(t, ti){
      WORDS.forEach(function(w){
        var tag = w[1];
        var picks = t.picks.filter(function(p){ return p.tags.indexOf(tag) >= 0 || (tag === "cheap" && p.tags.indexOf("free") >= 0); });
        if (picks.length < 3) return;
        var key = (w[0] + "|" + t.kind).toLowerCase();
        if (seen[key]) return; seen[key] = 1;
        LISTS.push({ adj:w[0], kind:t.kind, who:t.who, lab:t.lab, note:t.note, kw:t.kw, topic:ti, picks:picks.slice(0, 6) });
      });
    });
  })();


  var $ = function(id){ return document.getElementById(id); };
  var rand = function(n){ return Math.floor(Math.random()*n); };
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var COLORS = ["rgba(255,230,46,.5)","rgba(255,122,168,.5)","rgba(255,90,60,.48)","rgba(110,224,107,.5)"];
  var SOLID = ["rgba(255,230,46,.8)","rgba(255,122,168,.75)","rgba(255,90,60,.65)","rgba(110,224,107,.75)"];
  function uniq(a){ var s = {}; return a.filter(function(x){ var k = x.toLowerCase(); if (s[k]) return false; s[k] = 1; return true; }); }
  var ADJS = uniq(LISTS.map(function(l){ return l.adj; })), KINDS = uniq(LISTS.map(function(l){ return l.kind; }));
  function sing(t){ if (t.length > 3 && /ies$/.test(t)) return t.slice(0,-3) + "y"; if (t.length > 3 && /s$/.test(t) && !/ss$/.test(t)) return t.slice(0,-1); return t; }
  function tokens(w){ return String(w).toLowerCase().replace(/[^a-z0-9$]+/g," ").trim().split(" ").filter(Boolean).map(sing); }
  function norm(w){ return tokens(w).join(" "); }
  LISTS.forEach(function(l, i){ l.id = i; l.tok = {}; tokens(l.adj + " " + l.kind + " " + l.kw).forEach(function(t){ l.tok[t] = 1; }); });
  function find(a, k){ a = norm(a); k = norm(k); for (var i = 0; i < LISTS.length; i++) if (norm(LISTS[i].adj) === a && norm(LISTS[i].kind) === k) return LISTS[i]; return null; }
  function tidy(w){ w = String(w).replace(/\s+/g," ").trim().slice(0,40); return w.charAt(0).toUpperCase() + w.slice(1); }
  function el(tag, cls, text){ var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function host(u){ try { return new URL(u).hostname.replace(/^www\./,""); } catch(e){ return ""; } }

  $("count").textContent = LISTS.length.toLocaleString("en-US") + " lists";
  $("adj-options").innerHTML = ADJS.map(function(w){ return '<option value="'+w+'"></option>'; }).join("");
  $("kind-options").innerHTML = KINDS.map(function(w){ return '<option value="'+w+'"></option>'; }).join("");

  // ----- saved (this device only) -----
  var saved = [];
  function keyOf(l){ return (l.adj + "|" + l.kind).toLowerCase(); }
  var BYKEY = {}; LISTS.forEach(function(l){ BYKEY[keyOf(l)] = l; });
  try { saved = JSON.parse(localStorage.getItem("tbo-saved-v2") || "[]").filter(function(k){ return BYKEY[k]; }); } catch(e) { saved = []; }
  function persist(){ try { localStorage.setItem("tbo-saved-v2", JSON.stringify(saved)); } catch(e) {} }

  // ----- reels -----
  var measure = $("measure");
  function widthOf(w){ measure.textContent = w || " "; return measure.getBoundingClientRect().width; }
  var reels = [
    { gum:$("gumA"), win:$("winA"), strip:$("stripA"), pool:ADJS, cur:"", dur:1400, extra:14 },
    { gum:$("gumB"), win:$("winB"), strip:$("stripB"), pool:KINDS, cur:"", dur:1950, extra:20 }
  ];
  var current = null, colorIdx = [0,1], spinning = false;
  function cells(words){ var f = document.createDocumentFragment(); words.forEach(function(w){ f.appendChild(el("span","cell",w)); }); return f; }
  function setWidth(r, w){ r.win.style.width = Math.ceil(widthOf(w)) + "px"; }
  function place(r, w){ r.cur = w; r.strip.textContent = ""; r.strip.appendChild(cells([w])); r.strip.style.transition = "none"; r.strip.style.transform = "translateY(0)"; setWidth(r, w); }
  function land(r){ r.gum.classList.remove("land"); void r.gum.offsetWidth; r.gum.classList.add("land"); }
  function newColors(){ var a = rand(4), b = (a + 1 + rand(3)) % 4; colorIdx = [a,b]; reels[0].gum.style.backgroundColor = COLORS[a]; reels[1].gum.style.backgroundColor = COLORS[b]; }
  function roll(r, target, cb){
    if (reduce) { place(r, target); cb(); return; }
    var words = [r.cur]; for (var i = 0; i < r.extra; i++) words.push(r.pool[rand(r.pool.length)]); words.push(target);
    r.strip.textContent = ""; r.strip.appendChild(cells(words));
    r.strip.style.transition = "none"; r.strip.style.transform = "translateY(0)"; void r.strip.offsetHeight;
    r.strip.style.transition = "transform " + r.dur + "ms cubic-bezier(.16,.84,.3,1.08)";
    r.strip.style.transform = "translateY(-" + ((words.length - 1) * 1.15).toFixed(3) + "em)";
    setTimeout(function(){ setWidth(r, target); }, r.dur * .55);
    setTimeout(function(){ place(r, target); land(r); cb(); }, r.dur + 40);
  }
  function goTo(list){
    if (spinning) return;
    spinning = true; $("spin").disabled = true;
    newColors();
    var left = 2;
    roll(reels[0], list.adj, done); roll(reels[1], list.kind, done);
    function done(){ if (--left === 0) { spinning = false; $("spin").disabled = false; current = list; } }
  }
  function spin(){ var n; do { n = LISTS[rand(LISTS.length)]; } while (n === current); goTo(n); }

  // ----- tabs -----
  var tab = "spin";
  function showTab(t){
    tab = t;
    ["spin","saved"].forEach(function(k){ $("s-" + k).hidden = k !== t; });
    document.querySelectorAll(".tab").forEach(function(b){ if (b.getAttribute("data-tab") === t) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current"); });
    if (t === "saved") renderSaved();
    if (t === "spin") reels.forEach(function(r){ setWidth(r, r.cur); });
  }
  document.querySelectorAll(".tab").forEach(function(b){ b.addEventListener("click", function(){ closeDetail(); closeSheet(); showTab(b.getAttribute("data-tab")); }); });

  function rowFor(l, k, onPick){
    var b = el("button","row"); b.type = "button";
    var t = el("span","t");
    var c1 = el("span","chip",l.adj); c1.style.background = SOLID[k % 4];
    var c2 = el("span","chip",l.kind); c2.style.background = SOLID[(k + 2) % 4];
    t.appendChild(c1); t.appendChild(document.createTextNode(" ")); t.appendChild(c2);
    b.appendChild(t); b.appendChild(el("span","arr","→"));
    b.addEventListener("click", function(){ if (onPick) onPick(l); else openDetail(l); });
    return b;
  }
  function renderSaved(){
    var box = $("saved-list"); box.textContent = "";
    $("saved-empty").hidden = saved.length > 0;
    if (saved.length) { var wrap = el("div"); wrap.style.borderBottom = "1px solid var(--rule)"; saved.forEach(function(key, k){ wrap.appendChild(rowFor(BYKEY[key], k)); }); box.appendChild(wrap); }
    var badge = $("badge"); badge.hidden = !saved.length; badge.textContent = saved.length;
  }
  $("go-spin").addEventListener("click", function(){ showTab("spin"); });

  // ----- detail -----
  var open = null;
  function openDetail(l){
    open = l;
    var h = $("dtitle"); h.textContent = "";
    h.appendChild(el("span", null, "The best of"));
    [l.adj, l.kind].forEach(function(w, i){ var g = el("span","gum",w); g.style.backgroundColor = COLORS[(colorIdx[i] + (l === current ? 0 : l.id)) % 4]; h.appendChild(g); });
    $("dwho").textContent = "For " + l.who.charAt(0).toLowerCase() + l.who.slice(1) + ".";
    var cards = $("dcards"); cards.textContent = "";
    l.picks.forEach(function(p, i){
      var c = el("article","card"), hd = el("div","h");
      hd.appendChild(el("span","n",String(i + 1).padStart(2,"0"))); hd.appendChild(el("h2",null,p.name));
      c.appendChild(hd); c.appendChild(el("p",null,p.what));
      var kv = el("div","kv"); kv.appendChild(el("span","lab",l.lab)); var v = el("span",null,p.best); v.style.fontSize = "14px"; v.style.lineHeight = "1.45"; kv.appendChild(v); c.appendChild(kv);
      if (p.url) { var a = el("a",null,"Visit " + host(p.url) + " →"); a.href = p.url; a.target = "_blank"; a.rel = "noopener"; c.appendChild(a); }
      cards.appendChild(c);
    });
    $("dnote").textContent = ((l.note ? l.note + " " : "") + "Picks are never paid for. Check each link before you sign up.");
    syncSave();
    $("dscroll").scrollTop = 0;
    $("detail").classList.add("open"); $("detail").setAttribute("aria-hidden","false");
  }
  function closeDetail(){ $("detail").classList.remove("open"); $("detail").setAttribute("aria-hidden","true"); }
  function syncSave(){ var on = open && saved.indexOf(keyOf(open)) >= 0; var b = $("save"); b.classList.toggle("on", !!on); b.setAttribute("aria-pressed", on ? "true" : "false"); b.setAttribute("aria-label", on ? "Remove from saved" : "Save this list"); $("save-path").setAttribute("fill", on ? "#0B0B0F" : "none"); }
  $("save").addEventListener("click", function(){ if (!open) return; var k = saved.indexOf(keyOf(open)); if (k >= 0) saved.splice(k,1); else saved.push(keyOf(open)); persist(); syncSave(); renderSaved(); });
  $("back").addEventListener("click", closeDetail);
  $("dspin").addEventListener("click", function(){ closeDetail(); showTab("spin"); setTimeout(spin, 300); });
  $("read").addEventListener("click", function(){ if (current) openDetail(current); });
  $("spin").addEventListener("click", spin);

  // ----- sheet -----
  var NICHE = [["Wah wah.","Nobody has asked for “The best of {c}” yet. Respect. These are close:"],["Ooh, niche.","“The best of {c}” isn’t a list yet. You’re early. Try these:"],["Too niche (for now).","We haven’t written “The best of {c}” yet. Closest picks:"]];
  var nt = 0;
  function openSheet(focusB){
    $("ia").value = reels[0].cur; $("ib").value = reels[1].cur;
    $("sheet-form").hidden = false; $("sheet-miss").hidden = true;
    $("scrim").classList.add("open"); $("sheet").classList.add("open"); $("sheet").setAttribute("aria-hidden","false");
    setTimeout(function(){ var i = focusB ? $("ib") : $("ia"); i.focus(); i.select(); }, 380);
  }
  function closeSheet(){ $("scrim").classList.remove("open"); $("sheet").classList.remove("open"); $("sheet").setAttribute("aria-hidden","true"); }
  reels[0].gum.addEventListener("click", function(){ if (!spinning) openSheet(false); });
  reels[1].gum.addEventListener("click", function(){ if (!spinning) openSheet(true); });
  $("scrim").addEventListener("click", closeSheet);
  $("cancel").addEventListener("click", closeSheet);
  $("retype").addEventListener("click", function(){ $("sheet-form").hidden = false; $("sheet-miss").hidden = true; $("ia").focus(); });
  function recommend(a, b){
    var kt = tokens(b), at = tokens(a), nk = norm(b);
    var sc = LISTS.map(function(l){
      var s = 0;
      if (norm(l.kind) === nk) s += 6;
      kt.forEach(function(t){ if (l.tok[t]) s += 3; else if (t.length > 3) { for (var k in l.tok) { if (k.length > 3 && (k.indexOf(t) === 0 || t.indexOf(k) === 0)) { s += 1.5; break; } } } });
      at.forEach(function(t){ if (l.tok[t]) s += 1; });
      return { l:l, s:s + Math.random()*.01 };
    }).sort(function(x,y){ return y.s - x.s; });
    var out = sc.filter(function(x){ return x.s >= 1; }).slice(0,3).map(function(x){ return x.l; });
    while (out.length < 3) { var r = LISTS[rand(LISTS.length)]; if (out.indexOf(r) < 0) out.push(r); }
    return out;
  }
  $("form").addEventListener("submit", function(e){
    e.preventDefault();
    var a = tidy($("ia").value), b = tidy($("ib").value);
    if (!a || !b) return;
    var hit = find(a, b);
    if (hit) { closeSheet(); if (hit !== current) setTimeout(function(){ goTo(hit); }, 250); return; }
    document.activeElement && document.activeElement.blur && document.activeElement.blur();
    var line = NICHE[nt++ % NICHE.length];
    $("wah-head").textContent = line[0];
    $("wah-text").textContent = line[1].replace("{c}", a + " " + b);
    var box = $("recs"); box.textContent = "";
    var wrap = el("div"); wrap.style.borderBottom = "1px solid var(--rule)";
    recommend(a, b).forEach(function(l, k){
      wrap.appendChild(rowFor(l, k, function(x){ closeSheet(); setTimeout(function(){ goTo(x); }, 250); }));
    });
    box.appendChild(wrap);
    $("sheet-form").hidden = true; $("sheet-miss").hidden = false;
  });

  // ----- gummy shelf -----
  var PAL = { lemon:["#FFF8C2","#FFE62E","#B89400","#8A6E00"], pink:["#FFE0EC","#FF7AA8","#B83466","#8F1F49"], tomato:["#FFD0C4","#FF5A3C","#A8260F","#7A1A08"], leaf:["#DFFFDA","#6EE06B","#24852A","#155C1A"], cobalt:["#D6E0FF","#2B5CFF","#12298F","#0A1A66"] };
  var BEAR = '<circle cx="31" cy="15" r="9"/><circle cx="69" cy="15" r="9"/><circle cx="50" cy="28" r="19"/><ellipse cx="50" cy="64" rx="22" ry="24"/><ellipse cx="27" cy="55" rx="8" ry="12" transform="rotate(30 27 55)"/><ellipse cx="73" cy="55" rx="8" ry="12" transform="rotate(-30 73 55)"/><circle cx="36" cy="87" r="10"/><circle cx="64" cy="87" r="10"/>';
  var SHAPES = {
    bear:{ body:function(){ return BEAR; }, hi:'<ellipse cx="42" cy="19" rx="8" ry="3.2" fill="#fff" opacity=".95" transform="rotate(-25 42 19)"/><ellipse cx="38" cy="56" rx="3" ry="9" fill="#fff" opacity=".6"/>', sp:[[40,48,1.3],[58,44,1],[56,62,1.4]], star:[60,66] },
    star:{ body:function(id){ return '<polygon points="50,12 59.99,38.25 88.04,39.64 66.17,57.25 73.51,84.36 50,69 26.49,84.36 33.83,57.25 11.96,39.64 40.01,38.25" stroke="url(#g'+id+')" stroke-width="9" stroke-linejoin="round"/>'; }, hi:'<ellipse cx="44" cy="31" rx="6" ry="2.6" fill="#fff" opacity=".95" transform="rotate(-55 44 31)"/>', sp:[[40,50,1.2],[58,44,1],[56,60,1.4]], star:[52,48] },
    sphere:{ body:function(){ return '<circle cx="50" cy="50" r="40"/>'; }, hi:'<ellipse cx="34" cy="28" rx="10" ry="4" fill="#fff" opacity=".95" transform="rotate(-35 34 28)"/>', sp:[[40,50,1.3],[58,44,1],[56,60,1.4]], star:[64,40] },
    tri:{ body:function(id){ return '<polygon points="18,22 82,22 50,80" stroke="url(#g'+id+')" stroke-width="14" stroke-linejoin="round"/>'; }, hi:'<ellipse cx="34" cy="22" rx="10" ry="2.6" fill="#fff" opacity=".95"/>', sp:[[40,36,1.2],[58,34,1],[52,50,1.4]], star:[62,38] },
    heart:{ body:function(){ return '<path d="M50 86 C20 66 8 48 14 32 C20 16 42 14 50 30 C58 14 80 16 86 32 C92 48 80 66 50 86 Z"/>'; }, hi:'<ellipse cx="28" cy="29" rx="8" ry="3.2" fill="#fff" opacity=".95" transform="rotate(-40 28 29)"/>', sp:[[40,50,1.3],[58,44,1],[56,60,1.4]], star:[68,36] }
  };
  function sparkle(x,y){ return '<path d="M'+x+' '+(y-5)+' L'+(x+1)+' '+(y-1)+' L'+(x+5)+' '+y+' L'+(x+1)+' '+(y+1)+' L'+x+' '+(y+5)+' L'+(x-1)+' '+(y+1)+' L'+(x-5)+' '+y+' L'+(x-1)+' '+(y-1)+' Z"/>'; }
  function gummy(kind, pal, id, delay){
    var s = SHAPES[kind], c = PAL[pal];
    var dots = s.sp.map(function(p){ return '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="'+p[2]+'"/>'; }).join("");
    return '<svg class="gummy" viewBox="0 0 100 100" style="animation-delay:'+delay+'s"><defs><radialGradient id="g'+id+'" gradientUnits="userSpaceOnUse" cx="56" cy="60" r="56"><stop offset="0" stop-color="'+c[0]+'"/><stop offset=".5" stop-color="'+c[1]+'"/><stop offset="1" stop-color="'+c[2]+'"/></radialGradient><filter id="f'+id+'" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB"><feGaussianBlur in="SourceAlpha" stdDeviation="3.5" result="b"/><feSpecularLighting in="b" surfaceScale="5" specularConstant="1.3" specularExponent="22" lighting-color="#ffffff" result="s"><fePointLight x="28" y="6" z="70"/></feSpecularLighting><feComposite in="s" in2="SourceAlpha" operator="in" result="si"/><feOffset in="SourceAlpha" dx="-3" dy="-4" result="o"/><feGaussianBlur in="o" stdDeviation="4" result="ob"/><feComposite in="SourceAlpha" in2="ob" operator="out" result="rim"/><feFlood flood-color="'+c[3]+'" flood-opacity=".55"/><feComposite in2="rim" operator="in" result="rc"/><feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="rc"/><feMergeNode in="si"/></feMerge></filter></defs><g opacity=".7"><g filter="url(#f'+id+')" fill="url(#g'+id+')">'+s.body(id)+'</g></g>'+s.hi+'<g class="tw" fill="#fff" style="animation-delay:'+(delay+.4)+'s">'+dots+sparkle(s.star[0],s.star[1])+'</g></svg>';
  }
  var shelf = [["bear","lemon"],["star","pink"],["sphere","tomato"],["tri","leaf"],["heart","cobalt"],["bear","tomato"]];
  $("shelf").innerHTML = shelf.map(function(p,i){ return gummy(p[0], p[1], "a"+i, -i*.37); }).join("");

  // ----- start -----
  var first = LISTS[rand(LISTS.length)];
  reels[0].cur = first.adj; reels[1].cur = first.kind;
  place(reels[0], first.adj); place(reels[1], first.kind); newColors(); current = first;
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ reels.forEach(function(r){ setWidth(r, r.cur); }); });
  window.addEventListener("resize", function(){ reels.forEach(function(r){ setWidth(r, r.cur); }); });
  renderSaved();
})();
</script>
